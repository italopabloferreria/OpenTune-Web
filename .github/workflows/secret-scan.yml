name: Secret scan (new commits)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          if ! printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status; then
            printf 'Secret scanner checksum verification failed.\n'
            exit 2
          fi
          tar -xzf "$archive" -C "$tool_dir" gitleaks

      - name: Scan newly introduced commits
        shell: bash
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_PUSH_BEFORE: ${{ github.event.before }}
          SCAN_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$SCAN_HEAD^{commit}" >/dev/null 2>&1; then
            printf 'Secret scan could not establish the head commit.\n'
            exit 2
          fi
          log_opts='--all --full-history'
          case "$SCAN_EVENT" in
            push) base="$SCAN_PUSH_BEFORE" ;;
            pull_request) base="$SCAN_PR_BASE" ;;
            workflow_dispatch) base='' ;;
            *) printf 'Secret scan received an unsupported event.\n'; exit 2 ;;
          esac
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ "$base" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$base^{commit}" >/dev/null 2>&1; then
            if [[ "$SCAN_EVENT" != push ]] || git merge-base --is-ancestor "$base" "$SCAN_HEAD"; then
              log_opts="$base..$SCAN_HEAD --full-history"
            fi
          fi
          if [[ "$log_opts" == '--all --full-history' ]]; then
            printf 'Secret scan is checking complete fetched history because no safe incremental range was established.\n'
          fi
          # No historical exceptions. Diagnose locally with redaction enabled.
          : > "$RUNNER_TEMP/gitleaks-no-exceptions.txt"
          status=0
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git .git \
            --config=.github/security/gitleaks.toml \
            --gitleaks-ignore-path="$RUNNER_TEMP/gitleaks-no-exceptions.txt" \
            --log-opts="$log_opts" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --max-decode-depth=3 \
            --max-archive-depth=3 \
            --log-level=error \
            --no-banner \
            --exit-code=1 >/dev/null 2>&1 || status=$?
          case "$status" in
            0) printf 'Secret scan passed.\n' ;;
            1) printf 'Secret scan blocked: candidate secrets detected. Diagnose locally with redaction enabled.\n'; exit 1 ;;
            *) printf 'Secret scan could not complete. Diagnose locally with redaction enabled.\n'; exit 2 ;;
          esac
